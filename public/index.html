<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barrio Fantasía">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=3">
<title>Barrio de Fantasía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface2:#EBEBEB; --ink:#111111; --muted:#5C5C5C; --line:#E0E0E0;
  --grass:#D7131F; --on-grass:#FFFFFF; --bib:#111111; --on-bib:#FFFFFF; --danger:#D7131F;
  --head-bg:#111111; --head-ink:#FFFFFF;
  --POR:#1F4FA3; --DEF:#1E7B45; --MED:#B7790B; --DEL:#D7131F;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D; --surface:#1A1A1A; --surface2:#262626; --ink:#F5F5F5; --muted:#A3A3A3; --line:#2E2E2E;
    --grass:#E31B27; --on-grass:#FFFFFF; --bib:#F5F5F5; --on-bib:#111111; --danger:#FF6B6B;
    --head-bg:#000000; --head-ink:#FFFFFF;
    --POR:#7FA0F0; --DEF:#5FD08F; --MED:#F0B65A; --DEL:#E31B27;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#1A1A1A; --surface2:#262626; --ink:#F5F5F5; --muted:#A3A3A3; --line:#2E2E2E;
  --grass:#E31B27; --on-grass:#FFFFFF; --bib:#F5F5F5; --on-bib:#111111; --danger:#FF6B6B;
  --head-bg:#000000; --head-ink:#FFFFFF;
  --POR:#7FA0F0; --DEF:#5FD08F; --MED:#F0B65A; --DEL:#E31B27;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%;min-height:100dvh;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:800;letter-spacing:-.005em;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grass);outline-offset:2px}

/* Cabecera */
.top{background:var(--head-bg);color:var(--head-ink);border-radius:0 0 28px 28px;margin:0;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:980px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));flex-shrink:0}
.brand b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.brand span{font-family:'Barlow Condensed',Impact,sans-serif;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--grass);padding:3px 12px;border-radius:999px}
.mechip{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--head-ink);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;max-width:220px}
.mechip i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--bib);color:var(--on-bib);display:grid;place-items:center;font-family:'Barlow Condensed',serif;font-weight:800;font-size:15px;flex:none}
.mechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:6px;width:100%}
nav button{display:flex;align-items:center;gap:6px;background:transparent;border:0;border-radius:999px;color:var(--head-ink);padding:8px 16px;font-weight:600;opacity:.75}
nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{opacity:1;background:var(--grass);color:#fff}
main{max-width:980px;width:100%;margin:0 auto;padding:22px 16px 40px;flex:1}

@media (min-width:720px){
  .top{margin:0 8px;border-radius:0 0 32px 32px}
  nav{width:auto}
  .top-in{flex-wrap:nowrap}
}
@media (max-width:719px){
  nav{
    position:fixed;left:0;right:0;bottom:0;width:100%;z-index:50;
    background:var(--head-bg);display:flex;justify-content:space-around;align-items:center;gap:2px;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
    border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25);
    border-top:1px solid rgba(255,255,255,.08);
    transition:transform .22s cubic-bezier(0.16,1,0.3,1),opacity .2s ease;
  }
  html.has-modal nav{
    transform:translateY(100%);
    opacity:0;
    pointer-events:none;
  }
  nav button{flex-direction:column;gap:3px;font-size:11px;border-radius:12px;padding:6px 4px;flex:1;opacity:.7}
  nav button svg{width:18px;height:18px}
  nav button[aria-current="page"]{opacity:1;background:var(--grass);color:#fff}
  main{padding-bottom:calc(85px + env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(85px + env(safe-area-inset-bottom,0px))}
}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec-head h2{font-size:34px;text-transform:uppercase;letter-spacing:.005em}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}

.btn{background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--grass);border-color:var(--grass);color:var(--on-grass)}
.btn.primary:hover{filter:brightness(.95)}
.btn.bib{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:18px}
.banner p{margin:0}
.banner.err{border-color:var(--danger)}

/* Próximo partido: tarjeta grande */
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:28px;padding:24px 26px;display:grid;gap:12px}
.hero .kick{font-size:13px;font-weight:700;color:var(--grass);text-transform:uppercase;letter-spacing:.04em}
.hero h1{font-size:clamp(38px,9vw,64px);font-weight:800;text-transform:uppercase}
.hero .where{color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-top:6px}
.hero .count{font-family:'Barlow Condensed',serif;font-size:24px;font-weight:700}
.hero.empty p{margin:0;color:var(--muted)}

/* Lista de partidos: tarjetas separadas */
.list{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
.mrow:hover{background:var(--surface2)}
.mdate{display:grid;justify-items:start}
.mdate b{font-family:'Barlow Condensed',serif;font-size:40px;font-weight:800;line-height:.9}
.mdate span{font-size:14px;color:var(--muted);text-transform:uppercase;font-weight:700}
.minfo h3{font-family:'Barlow Condensed',Impact,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.minfo p{margin:2px 0 0;color:var(--muted);font-size:14px}
.mres{text-align:right}
.mres .score{font-family:'Barlow Condensed',serif;font-size:36px;font-weight:800}
.mres .count{font-family:'Barlow Condensed',serif;font-size:22px;font-weight:700;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--ink)}
.tag.warn{background:var(--ink);color:var(--surface)}

/* Jugadores: cromos redondeados */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cromo{position:relative;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:12px 0 14px;overflow:hidden;display:grid;color:var(--ink)}
.cromo.mine{border:2px solid var(--ink)}
.cromo.POR{--c:var(--POR)}.cromo.DEF{--c:var(--DEF)}.cromo.MED{--c:var(--MED)}.cromo.DEL{--c:var(--DEL)}
.cromo-top{display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.cromo-top .rating{font-family:'Barlow Condensed',serif;font-size:40px;font-weight:900;line-height:.9;color:var(--c)}
.cromo-top .pos{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:999px;padding:2px 9px}
.avatar{width:64px;height:64px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center;background:var(--c);font-family:'Barlow Condensed',Impact,sans-serif;font-size:24px;font-weight:800;color:#fff;overflow:hidden}
.has-img{padding:0 !important;overflow:hidden !important;border-radius:50% !important;background:#181818}
.has-img img{width:100% !important;height:100% !important;max-width:100% !important;max-height:100% !important;object-fit:cover !important;border-radius:50% !important;display:block !important;margin:0 auto}
.avatar.is-dorsal{font-size:30px;letter-spacing:-1px}
.avatar-lg{width:76px;height:76px;margin:0;font-size:32px;flex-shrink:0;overflow:hidden}
.cromo h3{font-size:20px;padding:0 12px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:10px 14px 0;text-align:center;background:var(--surface2);border-radius:16px;padding:6px 0}
.mini dt{font-size:11px;color:var(--muted)}
.mini dd{margin:0;font-weight:700}
.price{padding:8px 12px 0;font-size:13px;color:var(--muted)}

/* Tablas en tarjeta */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px}
table{width:100%;border-collapse:collapse;min-width:460px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.pts{font-family:'Barlow Condensed',serif;font-size:22px;font-weight:800}
tr.lead td{background:color-mix(in srgb,var(--grass) 10%,transparent)}
tr.me td:first-child{box-shadow:inset 4px 0 0 var(--grass)}
td small{display:block;color:var(--muted);font-weight:400;font-size:12px;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.pos-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c)}
.pos-dot.POR{--c:var(--POR)}.pos-dot.DEF{--c:var(--DEF)}.pos-dot.MED{--c:var(--MED)}.pos-dot.DEL{--c:var(--DEL)}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 18px}
.board h3{font-size:21px;margin-bottom:8px}
.board ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.board li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:5px}
.board li b{font-family:'Barlow Condensed',serif;font-size:20px}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 18px;margin-top:24px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}

/* Chips: píldoras */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.wait{background:var(--bib);border-color:var(--bib);color:var(--on-bib)}
.chip[disabled]{cursor:default;opacity:1}

/* Plantilla fantasy */
.squad{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.slot{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:14px 16px;min-height:104px;display:grid;align-content:space-between;gap:6px}
.slot.full{border:1px solid var(--line);border-left:6px solid var(--c)}
.slot.POR{--c:var(--POR)}.slot.DEF{--c:var(--DEF)}.slot.MED{--c:var(--MED)}.slot.DEL{--c:var(--DEL)}
.slot .nm{font-family:'Barlow Condensed',serif;font-size:22px;font-weight:800}
.slot .meta{font-size:13px;color:var(--muted)}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.budget{height:10px;background:var(--surface2);border-radius:999px;margin:12px 0 6px;overflow:hidden}
.budget i{display:block;height:100%;background:var(--ink);border-radius:999px}
.budget i.over{background:var(--danger)}
.capt{color:var(--grass)}

/* Diálogos: hojas redondeadas y bloqueo de scroll de fondo */
html.has-modal, html.has-modal body{
  overflow:hidden !important;
  overscroll-behavior:none !important;
  touch-action:none;
}
dialog{
  border:0;padding:0;border-radius:28px;width:min(680px,calc(100vw - 24px));
  background:var(--surface);color:var(--ink);box-shadow:0 20px 48px rgba(0,0,0,.35);
  z-index:100;
}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:99}
.dlg-body{
  padding:24px;max-height:calc(100dvh - 80px);overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
}
.dlg-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:12px;position:sticky;top:-24px;background:var(--surface);z-index:20;
  padding:18px 0 10px;margin-top:-24px;border-bottom:1px solid var(--line);
}
.dlg-head h2{font-size:30px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{
  background:var(--surface2);border:0;border-radius:50%;width:40px;height:40px;
  font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;flex-shrink:0;
  color:var(--ink);transition:background .15s ease,transform .1s ease;
}
.x:hover{background:var(--line)}
.x:active{transform:scale(0.92)}
@media (max-width:719px){
  dialog{
    width:100%;max-width:100%;inset:auto 0 0 0;margin:0;
    border-radius:26px 26px 0 0;
    max-height:calc(100dvh - env(safe-area-inset-top, 24px) - 24px);
    overflow:hidden;
    z-index:100;
  }
  .dlg-body{
    padding:16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height:calc(100dvh - env(safe-area-inset-top, 24px) - 24px);
    overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .dlg-head{
    position:sticky;top:-16px;margin:-16px 0 10px;padding:14px 0 10px;
    background:var(--surface);z-index:20;border-bottom:1px solid var(--line);
  }
  .dlg-head h2{font-size:24px}
}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
label.f{display:grid;gap:4px;margin-top:12px;font-weight:700;font-size:14px}
input[type=text],input[type=date],input[type=time],select,input[type=number]{font:inherit;color:inherit;background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:10px 14px;width:100%;font-weight:400}
input[type=text]:focus,input[type=date]:focus,input[type=time]:focus,select:focus,input[type=number]:focus{border-color:var(--ink);outline:none}
input[type=range]{width:100%;accent-color:var(--grass)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:520px){.teams{grid-template-columns:1fr}}
.team{border:1px solid var(--line);border-radius:24px;padding:14px 16px;background:var(--surface)}
.team.b{background:var(--surface2)}
.team h3{font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.team h3 small{font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
.team ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.team li{display:flex;justify-content:space-between;gap:8px}
.board-score{display:flex;justify-content:center;align-items:center;gap:18px;margin:12px 0;font-family:'Barlow Condensed',serif;font-size:20px;font-weight:700}
.board-score b{font-size:60px;font-weight:900;line-height:1;letter-spacing:-.03em}
.rtable{min-width:0}
.rtable input[type=number]{width:54px;padding:6px 4px;text-align:center}
.rtable td,.rtable th{padding:7px 8px}
.rtable .grp td{background:var(--surface2);font-weight:700;text-align:left;font-family:'Barlow',sans-serif;font-size:14px}
.empty-note{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:24px;padding:24px;text-align:center}
.foot{max-width:980px;margin:0 auto;padding:16px 18px 36px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.foot button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:2px}
@media (max-width:719px){.foot{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:90;max-width:calc(100vw - 32px);font-weight:600}
@media (max-width:719px){.toast{bottom:calc(85px + env(safe-area-inset-bottom,0px))}}
.toast[hidden]{display:none}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:50%;font-weight:800;line-height:1;padding:0;color:var(--ink)}
.stepper button:disabled{opacity:0.25;cursor:not-allowed;pointer-events:none}
.stepper b{min-width:22px;text-align:center}
.num-select{
  font-family:'Barlow Condensed',Impact,sans-serif;
  font-size:17px;
  font-weight:800;
  text-align:center;
  text-align-last:center;
  padding:2px 18px 2px 6px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background-color:var(--surface2);
  color:var(--ink);
  cursor:pointer;
  width:48px;
  height:32px;
  box-sizing:border-box;
  -webkit-appearance:none;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'%3E%3Cpath fill='%23666' d='M0 0l4 5 4-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 4px center;
  background-size:8px 5px;
}
.num-select:focus{
  border-color:var(--grass);
  outline:none;
  background-color:var(--surface);
}
.rate-select{
  width:62px;
  height:34px;
  font-size:18px;
  padding-right:18px;
}
.ico{display:inline-flex;align-items:center;gap:4px;margin-left:6px;vertical-align:middle}
.ico-i{width:16px;height:16px;display:inline-block}
.grid-ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ach{border:1px dashed var(--line);border-radius:22px;padding:12px 14px;display:grid;gap:2px;color:var(--muted)}
.ach.on{border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.ach b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.01em}
.ach span{font-size:13px}
.ach small{font-size:12px;font-weight:700;color:var(--grass)}
.ach.secret{font-style:italic}
.ach{position:relative}
.ach.on{padding-right:64px}
.vmark{position:absolute;top:50%;right:14px;transform:translateY(-50%);font-family:'Barlow Condensed',Impact,sans-serif;font-size:52px;font-weight:900;line-height:1;color:var(--grass);pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  .mrow,.btn,.chip{transition:background .15s,border-color .15s}
}
details.who{margin-top:12px}
details.who summary{cursor:pointer;font-weight:700;color:var(--ink);list-style:none}
details.who summary::-webkit-details-marker{display:none}
details.who summary::after{content:'  +';color:var(--grass)}
details.who[open] summary::after{content:'  −'}

/* Desplegable de logros en el perfil del jugador */
details.ach-collapse{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin:16px 0;overflow:hidden;transition:border-color .15s,box-shadow .15s}
details.ach-collapse[open]{border-color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.06)}
summary.ach-summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--surface);transition:background .15s}
summary.ach-summary::-webkit-details-marker{display:none}
summary.ach-summary:hover{background:var(--surface2)}
details.ach-collapse[open] summary.ach-summary{border-bottom:1px solid var(--line);background:var(--surface2)}
.ach-summary-left{display:flex;align-items:center;gap:10px}
.ach-summary-ico{width:22px;height:22px;stroke:var(--grass);flex-shrink:0}
.ach-summary-left b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:24px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1;color:var(--ink)}
.ach-summary-right{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.ach-chevron{width:18px;height:18px;stroke:currentColor;transition:transform .2s ease;flex-shrink:0}
details.ach-collapse[open] .ach-chevron{transform:rotate(180deg)}
.ach-hint-open{display:none}
details.ach-collapse[open] .ach-hint-closed{display:none}
details.ach-collapse[open] .ach-hint-open{display:inline}
.ach-body{padding:14px 14px 16px;background:var(--surface)}

/* Botones de WhatsApp */
.btn.wa{background:#25D366;border-color:#25D366;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.btn.wa:hover{background:#20bd5a;border-color:#20bd5a}
.wa-ico{width:16px;height:16px;fill:currentColor;flex-shrink:0}

/* Racha reciente de partidos (V E D) */
.form-strip{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.form-badge{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;display:inline-grid;place-items:center;color:#fff;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.form-badge.win{background:#1E7B45}
.form-badge.draw{background:#B7790B}
.form-badge.loss{background:#D7131F}
.form-empty{font-size:12px;color:var(--muted);font-style:italic}

/* Banner celebración de MVP */
.mvp-banner{background:linear-gradient(135deg,rgba(223,179,67,.18) 0%,rgba(223,179,67,.06) 100%);border:1.5px solid #dfb343;border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0;box-shadow:0 4px 14px rgba(223,179,67,.15)}
.mvp-star{font-size:32px;line-height:1}
.mvp-text{flex:1}
.mvp-kicker{font-size:12px;font-weight:800;letter-spacing:1px;color:#dfb343;text-transform:uppercase}
.mvp-name{font-family:'Barlow Condensed',Impact,sans-serif;font-size:24px;font-weight:800;text-transform:uppercase;color:var(--ink);line-height:1.1}
.mvp-score{font-size:13px;color:var(--muted)}

/* Carta EA FC / FIFA */
.fifa-card-wrap{display:flex;flex-direction:column;align-items:center;margin:16px 0}
.fifa-card{
  width:240px;height:352px;
  background:linear-gradient(135deg,#261e08 0%,#14120e 35%,#0a0a0a 70%,#1c1910 100%);
  border:2.5px solid #dfb343;border-radius:24px 24px 50px 50px;
  box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 16px rgba(223,179,67,.25),inset 0 1px 2px rgba(255,255,255,.4);
  position:relative;padding:16px 14px;color:#f5f5f5;display:flex;flex-direction:column;
  font-family:'Barlow Condensed',Impact,sans-serif;overflow:hidden;
}
.fifa-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:radial-gradient(ellipse at 50% 0%,rgba(223,179,67,.35) 0%,transparent 75%);
  pointer-events:none;
}
.fifa-card-header{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.fifa-card-ovr{font-size:38px;font-weight:900;line-height:.85;color:#f7df79;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.fifa-card-pos{font-size:16px;font-weight:800;letter-spacing:1px;color:#e8e8e8}
.fifa-card-badge{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.fifa-card-avatar{
  margin:2px auto 6px;width:76px;height:76px;border-radius:50%;
  background:linear-gradient(145deg,#242424,#121212);border:2px solid #dfb343;
  box-shadow:0 4px 12px rgba(0,0,0,.6);display:grid;place-items:center;
  font-size:32px;font-weight:900;color:#f7df79;position:relative;z-index:2;
}
.fifa-card-name{
  text-align:center;font-size:20px;font-weight:900;text-transform:uppercase;
  letter-spacing:.5px;color:#fff;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-bottom:1px solid rgba(223,179,67,.3);padding-bottom:4px;
}
.fifa-card-club{text-align:center;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#dfb343;margin-bottom:6px}
.fifa-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:4px;font-size:13px;font-family:'Barlow',system-ui,sans-serif}
.fifa-card-stat{display:flex;justify-content:space-between;align-items:center}
.fifa-card-stat b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:17px;font-weight:800;color:#f7df79}
.fifa-card-stat span{font-size:11px;font-weight:700;color:#c0c0c0;letter-spacing:.5px}

/* Convocatoria organizada */
.convocatoria-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.conv-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative}
.conv-card.mine{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.conv-card.wait{border-color:rgba(183,121,11,.4);background:rgba(183,121,11,.05)}
.conv-num{font-family:'Barlow Condensed',serif;font-size:14px;font-weight:800;color:var(--muted);width:16px;text-align:center;flex-shrink:0}
.conv-num.wait{color:var(--MED);width:22px}
.conv-avatar{width:32px;height:32px;font-size:14px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden}
.conv-info{display:flex;flex-direction:column;flex:1;min-width:0}
.conv-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-info span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.conv-remove{background:none;border:0;color:var(--muted);font-size:20px;font-weight:700;line-height:1;padding:4px 6px;cursor:pointer;margin-left:auto}
.conv-remove:hover{color:var(--danger)}

/* Pódium de clasificación */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:16px 0 20px;text-align:center}
.podium-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 6px 14px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;width:100%;transition:transform .15s}
.podium-card:active{transform:scale(.98)}
.podium-card.first{border:2px solid #dfb343;background:linear-gradient(180deg,rgba(223,179,67,.14) 0%,var(--surface) 60%);padding-top:16px}
.podium-card.second{border:1.5px solid #a8b0b8;background:linear-gradient(180deg,rgba(168,176,184,.14) 0%,var(--surface) 60%)}
.podium-card.third{border:1.5px solid #cd7f32;background:linear-gradient(180deg,rgba(205,127,50,.14) 0%,var(--surface) 60%)}
.podium-rank{font-size:26px;line-height:1;margin-bottom:6px}
.podium-card.first .podium-rank{font-size:32px}
.podium-avatar{width:56px;height:56px;font-size:20px;margin-bottom:6px;display:grid;place-items:center;border-radius:50%;overflow:hidden}
.podium-card.first .podium-avatar{width:64px;height:64px;font-size:24px;border-radius:50%;overflow:hidden}
.podium-name{font-family:'Barlow Condensed',Impact,sans-serif;font-size:16px;font-weight:800;text-transform:uppercase;color:var(--ink);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-card.first .podium-name{font-size:18px}
.podium-pts{font-family:'Barlow Condensed',serif;font-size:20px;font-weight:800;color:var(--grass);line-height:1;margin-top:3px}
.podium-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:3px;justify-content:center}

/* Stepper táctil móvil y avatares de tabla */
.stepper.touch{gap:6px}
.stepper.touch button{width:32px;height:32px;font-size:16px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.stepper.touch button:active{background:var(--ink);color:var(--surface)}
.stepper.touch b{min-width:30px;font-size:16px;font-family:'Barlow Condensed',serif}
.rtable-avatar{width:28px;height:28px;font-size:12px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden}

/* Ajuste de equipos responsive y sin scroll horizontal */
.adjust-cards-list{display:flex;flex-direction:column;gap:10px}
.adjust-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.adjust-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.adjust-player{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}
.adjust-avatar{
  width:36px;
  height:36px;
  font-size:15px;
  border-radius:50%;
  flex-shrink:0;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.adjust-name-wrap{
  display:flex;
  flex-direction:column;
  min-width:0;
}
.adjust-name-wrap b{
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--ink);
}
.adjust-name-wrap small{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:4px;
}
.btn.adjust-move{
  padding:6px 12px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  border-radius:999px;
  flex-shrink:0;
  background:var(--surface2);
  border-color:var(--line);
  color:var(--ink);
}
.btn.adjust-move:hover{
  background:var(--ink);
  color:var(--surface);
  border-color:var(--ink);
}
.adjust-roles{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  background:var(--surface2);
  padding:4px;
  border-radius:12px;
}
.adjust-role-btn{
  border:0;
  background:transparent;
  padding:8px 0;
  border-radius:9px;
  font-family:'Barlow Condensed',Impact,sans-serif;
  font-size:14px;
  font-weight:800;
  color:var(--muted);
  cursor:pointer;
  transition:all .15s ease;
  display:grid;

}
.adjust-role-btn.active{

}

.adjust-role-btn.DEF.active{background:var(--DEF)}
.adjust-role-btn.MED.active{background:var(--MED)}
.adjust-role-btn.DEL.active{background:var(--DEL)}

<script>
(function(){
'use strict';

/* ---------- Constantes y reglas ---------- */
const POS={POR:'Portero',DEF:'Defensa',MED:'Centrocampista',DEL:'Delantero'};
const POS_PLURAL={POR:'Porteros',DEF:'Defensas',MED:'Centrocampistas',DEL:'Delanteros'};
const RULES={app:1,goal:{POR:7,DEF:3,MED:4,DEL:5},assist:{POR:3,DEF:3,MED:3,DEL:3},win:2,draw:1,lowConceded:{limit:5,pts:{POR:6,DEF:5,MED:3,DEL:0}},mvp:3,hat:2,hatGoals:5,penaltyNoVote:-2};
const BUDGET=35, SQUAD=5, DEFAULT_RATING=65, FORMATS=[6,7];
const TEAM_A='Claros', TEAM_B='Oscuros';
const ICONS={
  logros:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',
  partidos:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  jugadores:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  clasificacion:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  fantasy:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
};
const WA_ICON='<svg viewBox="0 0 24 24" class="wa-ico" aria-hidden="true"><path d="M17.472 14.382c-.301-.15-1.782-.879-2.058-.98-.276-.1-.477-.15-.678.15-.201.301-.78 1-.955 1.201-.176.2-.351.226-.652.075-.301-.15-1.272-.469-2.424-1.496-.897-.799-1.503-1.787-1.679-2.087-.176-.301-.019-.464.132-.614.136-.135.301-.351.452-.527.15-.176.201-.301.301-.502.1-.2.05-.376-.025-.527-.075-.15-.678-1.633-.929-2.235-.245-.586-.494-.506-.678-.515-.176-.009-.376-.01-.577-.01-.201 0-.527.075-.803.376-.276.301-1.054 1.03-1.054 2.511 0 1.482 1.079 2.912 1.23 3.113.15.201 2.124 3.243 5.146 4.549.719.311 1.28.497 1.718.636.722.229 1.379.197 1.898.12.578-.087 1.782-.728 2.033-1.431.251-.703.251-1.305.176-1.431-.075-.126-.276-.201-.577-.351zM12.04 2C6.54 2 2.08 6.46 2.08 11.96c0 1.96.57 3.82 1.63 5.39L2 22l4.81-1.66c1.51.98 3.3 1.57 5.23 1.57 5.5 0 9.96-4.46 9.96-9.96C22 6.46 17.54 2 12.04 2z"/></svg>';
const TABS=[['partidos','Partidos'],['jugadores','Jugadores'],['clasificacion','Clasificación'],['fantasy','Fantasy'],['logros','Logros']];
const COLLECTIONS=['players','ratings','matches','signups','fantasy','statsby','votes','seasons','preds'];

/* ---------- Utilidades ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function iso(d){const m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day}
const parseDate=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const fmtLong=m=>parseDate(m.date).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fmtWeekday=m=>parseDate(m.date).toLocaleDateString('es-ES',{weekday:'long'});
const fmtMonth=m=>parseDate(m.date).toLocaleDateString('es-ES',{month:'short'}).replace('.','');
const money=n=>n.toFixed(1).replace('.',',')+' M';
const byDate=(a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1;
const initials=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const sum=(l,f)=>l.reduce((s,x)=>s+f(x),0);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- Estado compartido ---------- */
let db=null, user=null, status='loading', errCode='';
const me={id:null,name:'',isAdmin:false,canWrite:null};
const D={players:{},ratings:{},matches:{},signups:{},fantasy:{},statsby:{},votes:{},seasons:{},preds:{}};
const loaded={};
const ui={tab:'partidos',posFilter:'ALL',playerPos:'ALL',playerSearch:'',achOpen:false};
let dlgView=null, onboarded=false, pendingConfirm=null, chain=Promise.resolve(), toastTimer=null;

function P(id){
  const p=D.players[id];if(!p)return null;
  const r=D.ratings[id];
  return {id:id,name:p.name||'Jugador',pos:POS[p.pos]?p.pos:'MED',dorsal:p.dorsal||null,photo:p.photo||null,guest:!!p.guest,rating:(r&&r.rating)||DEFAULT_RATING};
}
function playerAvatar(p,cls){
  const c=cls||'avatar';
  if(!p)return '<div class="'+c+'">?</div>';
  if(p.photo){
    return '<div class="'+c+' has-img"><img src="'+esc(p.photo)+'" alt="'+esc(p.name)+'"></div>';
  }
  const badge=p.dorsal?String(p.dorsal):(initials(p.name)||'?');
  return '<div class="'+c+(p.dorsal?' is-dorsal':'')+'">'+esc(badge)+'</div>';
}
const plist=()=>Object.keys(D.players).map(P);
function normMatch(id,m){
  return Object.assign({
    id:id,
    date:'',
    time:'20:30',
    place:'',
    format:6,
    status:'open',
    stats:{},
    teamA:[],
    teamB:[],
    scoreA:m&&m.scoreA!=null?Number(m.scoreA):null,
    scoreB:m&&m.scoreB!=null?Number(m.scoreB):null
  },m);
}
const matchHasScore=m=>m&&m.status==='played'&&m.scoreA!=null&&m.scoreB!=null;
const M=id=>D.matches[id]?normMatch(id,D.matches[id]):null;
const mlist=()=>Object.keys(D.matches).map(id=>normMatch(id,D.matches[id]));
function rawMatch(m){const o=Object.assign({},m);delete o.id;return o}
function signedFor(mid){
  const arr=[];
  Object.keys(D.signups).forEach(pid=>{
    const ts=((D.signups[pid]||{}).matches||{})[mid];
    if(ts&&D.players[pid])arr.push({id:pid,ts:ts});
  });
  return arr.sort((a,b)=>a.ts-b.ts).map(x=>x.id);
}
const confirmedFor=m=>signedFor(m.id).slice(0,m.format*2);
function syncTeamsWithSignups(m){
  if(!m||m.status!=='open'||(!m.teamA.length&&!m.teamB.length))return false;
  const conf=confirmedFor(m);
  let changed=false;
  const newA=m.teamA.filter(id=>conf.indexOf(id)>-1);
  const newB=m.teamB.filter(id=>conf.indexOf(id)>-1);
  if(newA.length!==m.teamA.length||newB.length!==m.teamB.length)changed=true;
  conf.forEach(id=>{
    if(newA.indexOf(id)<0&&newB.indexOf(id)<0){
      if(newA.length<=newB.length)newA.push(id);
      else newB.push(id);
      changed=true;
    }
  });
  const newRoles=Object.assign({},m.roles||{});
  Object.keys(newRoles).forEach(id=>{
    if(newA.indexOf(id)<0&&newB.indexOf(id)<0){
      delete newRoles[id];
      changed=true;
    }
  });
  if(changed){
    m.teamA=newA;
    m.teamB=newB;
    m.roles=newRoles;
    return true;
  }
  return false;
}
function statsEntered(m,pid){const x=D.statsby[pid];return !!(x&&x.matches&&x.matches[m.id])}
/* Goles y asistencias vienen de statsby (los anota cada jugador).
   Si el partido es antiguo y aún los trae en el propio partido, se usan esos. */
function statOf(m,pid){
  const base=(m.stats&&m.stats[pid])||{};
  const x=statsEntered(m,pid)?D.statsby[pid].matches[m.id]:null;
  return {g:x?(x.g||0):(base.g||0),a:x?(x.a||0):(base.a||0)};
}

/* ---------- Notas entre jugadores ---------- */
function voteOf(mid,voter,target){
  const v=D.votes[voter];const x=v&&v.matches&&v.matches[mid];
  return x&&x[target]!=null?x[target]:null;
}
/* { pid: {avg, n, list:[{by,n}]} } solo con votos de jugadores del partido */
function ratingsFor(m){
  const inM=m.teamA.concat(m.teamB), out={};
  Object.keys(D.votes).forEach(by=>{
    if(inM.indexOf(by)<0)return;
    const x=((D.votes[by]||{}).matches||{})[m.id];if(!x)return;
    Object.keys(x).forEach(pid=>{
      if(inM.indexOf(pid)<0||pid===by)return;
      if(!out[pid])out[pid]={sum:0,n:0,list:[]};
      out[pid].sum+=x[pid];out[pid].n++;out[pid].list.push({by:by,n:x[pid]});
    });
  });
  Object.keys(out).forEach(pid=>{out[pid].avg=out[pid].sum/out[pid].n});
  return out;
}

/* ---------- Cierre de votación y MVP ---------- */
const fmtNum=n=>Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',');
function matchStart(m){const hm=(m.time||'20:30').split(':');const d=parseDate(m.date);d.setHours(+hm[0]||20,+hm[1]||0,0,0);return d.getTime()}
/* Plazo: 24 h desde que se da el partido por jugado (o desde su hora, si es un partido antiguo) */
function closesAt(m){return (m.playedAt||matchStart(m))+24*3600*1000}
const fmtClose=m=>new Date(closesAt(m)).toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
/* Han votado todos: cada jugador del partido ha puntuado a todos los demás */
function allVoted(m){
  const inM=m.teamA.concat(m.teamB);
  if(inM.length<2)return false;
  return inM.every(a=>inM.every(b=>a===b||voteOf(m.id,a,b)!=null));
}
/* Comprueba si un jugador en concreto ha votado a todos sus compañeros */
function playerVoted(m,pid){
  const inM=(m.teamA||[]).concat(m.teamB||[]);
  const col=inM.filter(id=>id!==pid);
  if(!col.length)return true;
  return col.every(id=>voteOf(m.id,pid,id)!=null);
}
function votesClosed(m){return m.status==='played'&&matchHasScore(m)&&(Date.now()>=closesAt(m)||allVoted(m))}
/* MVP: mejor media de notas recibidas (ids empatados incluidos) */
function realMvps(m){
  const R=ratingsFor(m), ids=Object.keys(R);
  if(!ids.length)return [];
  const best=Math.max.apply(null,ids.map(i=>R[i].avg));
  return ids.filter(i=>R[i].avg===best);
}
/* MVP Fantasy: quien más puntos fantasy suma en el partido (empates incluidos) */
function fantasyMvps(m){
  if(m.status!=='played'||!votesClosed(m))return [];
  const ps=m.teamA.concat(m.teamB).map(P).filter(Boolean);
  if(!ps.length)return [];
  const pts=ps.map(p=>({id:p.id,v:matchPoints(p,m)||0}));
  const best=Math.max.apply(null,pts.map(x=>x.v));
  if(best<=0)return [];
  return pts.filter(x=>x.v===best).map(x=>x.id);
}
function mvpBlock(m){
  const closed=votesClosed(m), real=realMvps(m), fan=fantasyMvps(m), R=ratingsFor(m);
  const names=ids=>ids.length?ids.map(i=>esc((P(i)||{}).name||'')).join(' y '):'Sin datos';
  const fp=fan.length?P(fan[0]):null;
  const fanPts=fp?(matchPoints(fp,m)||0):0;
  let h='<div class="boards" style="margin-top:16px">';
  h+='<div class="board" style="border-left:6px solid var(--grass)"><h3>MVP'+(closed?'':' <span class="tag">provisional</span>')+'</h3><p style="margin:0;font-weight:700;font-size:17px">'+names(real)+'</p>'+(real.length?'<p class="sub">Media de notas '+fmtNum(R[real[0]].avg)+'</p>':'')+'</div>';
  h+='<div class="board" style="border-left:6px solid var(--ink)"><h3>MVP Fantasy</h3><p style="margin:0;font-weight:700;font-size:17px">'+names(fan)+'</p>'+(fan.length?'<p class="sub">'+fmtNum(fanPts)+' puntos fantasy</p>':'')+'</div>';
  return h+'</div>';
}

/* ---------- Predicciones y temporadas ---------- */
const outcome=m=>{const a=scoreOf(m,'A'),b=scoreOf(m,'B');return a>b?'A':a<b?'B':'D'};
const predOf=(mid,uid)=>{const x=(D.preds[uid]||{}).matches||{};return x[mid]||null};
/* Se predice cuando el partido está abierto y ya tiene equipos */
const predOpen=m=>m.status==='open'&&m.teamA.length>0&&m.teamB.length>0;
function leaders(obj){
  const ids=Object.keys(obj).filter(k=>obj[k]>0&&P(k));
  if(!ids.length)return {v:0,ids:[]};
  const v=Math.max.apply(null,ids.map(k=>obj[k]));
  return {v:v,ids:ids.filter(k=>obj[k]===v)};
}
function seasonAwards(sid){
  const goals={},ast={},lud={};
  mlist().forEach(m=>{
    if(m.season!==sid||!votesClosed(m))return;
    m.teamA.concat(m.teamB).forEach(pid=>{
      const s=statOf(m,pid);
      goals[pid]=(goals[pid]||0)+s.g;
      ast[pid]=(ast[pid]||0)+s.a;
    });
    const out=outcome(m);
    Object.keys(D.preds).forEach(uid=>{
      if(D.players[uid]&&predOf(m.id,uid)===out)lud[uid]=(lud[uid]||0)+1;
    });
  });
  return {bota:leaders(goals),maestro:leaders(ast),ludopata:leaders(lud)};
}
function predBlock(m){
  if(!predOpen(m))return '';
  const mine=me.id?predOf(m.id,me.id):null;
  const can=!!me.id&&!!D.players[me.id]&&me.canWrite!==false;
  const cnt=Object.keys(D.preds).filter(u=>predOf(m.id,u)).length;
  let h='<div class="sec-head" style="margin-top:22px"><h2 style="font-size:26px">Predicción</h2><span class="tag">'+cnt+' '+(cnt===1?'predicción':'predicciones')+'</span></div>';
  h+='<p class="sub" style="margin:0 0 8px">¿Quién gana? Acertar el resultado suma 1 punto de predicción. Se puede cambiar hasta que se dé el partido por jugado.</p>';
  h+='<div class="chips">'+[['A',TEAM_A],['D','Empate'],['B',TEAM_B]].map(o=>'<button class="chip'+(mine===o[0]?' on':'')+'" '+(can?'data-action="pred" data-id="'+m.id+'" data-pick="'+o[0]+'"':'disabled')+' aria-pressed="'+(mine===o[0])+'">'+o[1]+'</button>').join('')+'</div>';
  if(!can)h+='<p class="sub" style="margin-top:8px">Crea tu perfil para predecir.</p>';
  return h;
}
function predResult(m){
  const picked=Object.keys(D.preds).filter(u=>predOf(m.id,u));
  if(!picked.length)return '';
  const out=outcome(m);
  const ok=picked.filter(u=>predOf(m.id,u)===out&&D.players[u]).map(u=>esc(D.players[u].name));
  const res=out==='D'?'empate':'ganó '+(out==='A'?TEAM_A:TEAM_B);
  return '<p class="sub" style="margin:12px 0 0">Resultado: '+res+'. Acertaron: '+(ok.length?ok.join(', '):'nadie')+'.</p>';
}

  const ids=Object.keys(D.seasons).sort((a,b)=>(D.seasons[a].created||0)-(D.seasons[b].created||0));

       row('Bota de Oro · más goles',a.bota,'goles')+row('Maestro de las asistencias · más asistencias',a.maestro,'asist.')+row('Ludópata · más predicciones acertadas',a.ludopata,'aciertos')+'</ol></div>';

function pitchBlock(m){

function matchIcons(m,pid){
  if(!votesClosed(m))return '';
  const all=m.teamA.concat(m.teamB);
  const g=statOf(m,pid).g, a=statOf(m,pid).a;
  const maxG=Math.max.apply(null,all.map(i=>statOf(m,i).g));
  const maxA=Math.max.apply(null,all.map(i=>statOf(m,i).a));
  let h='';

/* ---------- Historial entre amigos ---------- */
/* Juntos = en el mismo equipo; Contra = en equipos rivales. Solo partidos jugados. */
function histOf(pid){
  const rows={};
  const blank=()=>({pj:0,v:0,e:0,d:0,g:0,a:0});
  const add=(t,res,g,a)=>{t.pj++;t[res==='V'?'v':res==='E'?'e':'d']++;t.g+=g;t.a+=a};
  mlist().forEach(m=>{
    if(m.status!=='played')return;
    const inA=m.teamA.indexOf(pid)>-1, inB=m.teamB.indexOf(pid)>-1;
    if(!inA&&!inB)return;
    const side=inA?'A':'B';
    const mine=scoreOf(m,side), opp=scoreOf(m,side==='A'?'B':'A');
    const res=mine>opp?'V':mine===opp?'E':'D';
    const st=statOf(m,pid);
    const mates=side==='A'?m.teamA:m.teamB, riv=side==='A'?m.teamB:m.teamA;
    mates.forEach(q=>{
      if(q===pid)return;
      const r=rows[q]||(rows[q]={j:blank(),c:blank()});
      add(r.j,res,st.g,st.a);
    });
    riv.forEach(q=>{
      const r=rows[q]||(rows[q]={j:blank(),c:blank()});
      add(r.c,res,st.g,st.a);
    });
  });
  return rows;
}

  h+='<div class="chips">'+ps.map(p=>'<button class="chip'+(p.id===sel?' on':'')+'" data-action="hist-pick" data-id="'+p.id+'" aria-pressed="'+(p.id===sel)+'">'+esc(p.name)+'</button>').join('')+'</div>';
  if(!rows.length)return h+'<div class="empty-note" style="margin-top:12px">Todavía no hay partidos jugados con '+esc((P(sel)||{}).name||'este jugador')+'.</div>';
  h+='<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th rowspan="2">Jugador</th><th colspan="6">Juntos</th><th colspan="6">Contra</th></tr><tr><th>PJ</th><th>V</th><th>E</th><th>D</th><th>G</th><th>A</th><th>PJ</th><th>V</th><th>E</th><th>D</th><th>G</th><th>A</th></tr></thead><tbody>';
  rows.forEach(r=>{

  });
  return h+'</tbody></table></div>';
}

/* ---------- Puntuación ---------- */
function scoreOf(m,side){
  if(m&&m.scoreA!=null&&m.scoreB!=null)return side==='A'?Number(m.scoreA):Number(m.scoreB);
  const mine=side==='A'?m.teamA:m.teamB;
  return sum(mine,id=>statOf(m,id).g);
}
function matchPoints(p,m){
  if(m.status!=='played'||!votesClosed(m))return null;
  const inA=m.teamA.indexOf(p.id)>-1, inB=m.teamB.indexOf(p.id)>-1;
  if(!inA&&!inB)return null;
  const s=statOf(m,p.id);
  const my=scoreOf(m,inA?'A':'B'), opp=scoreOf(m,inA?'B':'A');
  let pts=RULES.app;
  pts+=(s.g||0)*RULES.goal[roleOf(m,p.id)];
  if((s.g||0)>=RULES.hatGoals)pts+=RULES.hat;
  pts+=(s.a||0)*RULES.assist[p.pos];
  pts+=my>opp?RULES.win:(my===opp?RULES.draw:0);
  if(opp<RULES.lowConceded.limit)pts+=RULES.lowConceded.pts[roleOf(m,p.id)];
  if(realMvps(m).indexOf(p.id)>-1)pts+=RULES.mvp;
  if(!playerVoted(m,p.id))pts+=RULES.penaltyNoVote;
  return pts;
}
function summary(p){
  const r={pj:0,g:0,a:0,mvpR:0,mvpF:0,pts:0};
  mlist().forEach(m=>{
    if(m.status!=='played')return;
    const s=statOf(m,p.id);
    r.pj++;r.g+=s.g||0;r.a+=s.a||0;
    if(votesClosed(m)){
      const v=matchPoints(p,m);
      if(v!=null)r.pts+=v;
      if(realMvps(m).indexOf(p.id)>-1)r.mvpR++;
      if(fantasyMvps(m).indexOf(p.id)>-1)r.mvpF++;
    }
  });
  return r;
}
const price=p=>Math.max(2,Math.round((2+(p.rating-50)*0.2)*10)/10);
function lastPlayed(){
  const pl=mlist().filter(m=>m.status==='played').sort(byDate);
  return pl.length?pl[pl.length-1]:null;
}
function managerPts(fid,onlyMatch){
  let t=0;
  mlist().forEach(m=>{
    if(m.status!=='played'||!votesClosed(m)||(onlyMatch&&m.id!==onlyMatch.id))return;
    const snap=m.fantasySnap&&m.fantasySnap[fid];if(!snap)return;
    (snap.squad||[]).forEach(pid=>{
      const p=P(pid);if(!p)return;
      t+=(matchPoints(p,m)||0)*(snap.captain===pid?2:1);
    });
  });
  return t;
}

function getPlayerForm(pid){
  const played = mlist()
    .filter(m=>m.status==='played'&&(m.teamA.indexOf(pid)>-1||m.teamB.indexOf(pid)>-1))
    .sort((a,b)=>byDate(b,a));
  return played.slice(0,5).map(m=>{
    const inA=m.teamA.indexOf(pid)>-1;
    const myG=scoreOf(m,inA?'A':'B');
    const oppG=scoreOf(m,inA?'B':'A');
    const res=myG>oppG?'V':(myG===oppG?'E':'D');
    const R=ratingsFor(m);
    const avgVote=(R[pid]&&R[pid].avg)?R[pid].avg:null;
    return {m:m,res:res,myG:myG,oppG:oppG,avgVote:avgVote};
  });
}

function renderFormBadges(pid){
  const forms=getPlayerForm(pid);
  if(!forms.length)return '<span class="form-empty">Sin partidos aún</span>';
  return '<div class="form-strip" title="Racha últimos '+forms.length+' partidos">'+
    forms.map(f=>{
      const cls=f.res==='V'?'win':(f.res==='E'?'draw':'loss');
      const tooltip=(f.res==='V'?'Victoria':(f.res==='E'?'Empate':'Derrota'))+' '+f.myG+'–'+f.oppG+(f.avgVote?' · Nota '+fmtNum(f.avgVote):'');
      return '<span class="form-badge '+cls+'" title="'+tooltip+'">'+f.res+'</span>';
    }).join('')+
  '</div>';
}

function calcFifaStats(p,s){
  const rit=Math.min(99,Math.max(50,Math.round(60+(s.pj*4))));
  const tir=Math.min(99,Math.max(40,Math.round(50+(s.pj?(s.g/s.pj)*35:0))));
  const pas=Math.min(99,Math.max(40,Math.round(50+(s.pj?(s.a/s.pj)*35:0))));
  const reg=Math.min(99,Math.max(50,Math.round(p.rating||75)));
  const def=p.pos==='DEF'?Math.min(99,Math.max(70,Math.round(75+s.pj*2))):(p.pos==='POR'?Math.min(99,Math.max(75,Math.round(80+s.pj*2))):Math.min(99,Math.max(40,Math.round(50+s.pj))));
  const fis=Math.min(99,Math.max(50,Math.round(60+(s.pts/Math.max(1,s.pj))*5)));
  return {rit:rit,tir:tir,pas:pas,reg:reg,def:def,fis:fis};
}

function waTextConvocatoria(m){
  const slots=m.format*2;
  const signed=signedFor(m.id);
  const conf=signed.slice(0,slots);
  const wait=signed.slice(slots);
  const dl=fmtLong(m)+' · '+m.time;
  let t='⚽ *BARRIO DE FANTASÍA*\n';
  t+='📅 *'+dl+'*\n';
  t+='📍 *'+(m.place||'Lugar por confirmar')+'* (Fútbol '+m.format+')\n\n';
  t+='✅ *Convocatoria ('+conf.length+'/'+slots+'):*\n';
  if(conf.length){
    conf.forEach((id,i)=>{
      const p=P(id);
      t+=(i+1)+'. '+(p?p.name:'Jugador')+' ('+(p?POS[p.pos]:'')+(p&&p.rating?' · '+p.rating:'')+')\n';
    });
  }else{
    t+='_Aún no hay nadie apuntado._\n';
  }
  if(wait.length){
    t+='\n⏳ *Lista de espera ('+wait.length+'):*\n';
    wait.forEach((id,i)=>{
      const p=P(id);
      t+=(i+1)+'. '+(p?p.name:'Jugador')+'\n';
    });
  }else if(slots-conf.length>0){
    t+='\n⏳ *Faltan '+(slots-conf.length)+' jugadores para completar.*';
  }else{
    t+='\n🔥 *¡Convocatoria completa!*';
  }
  t+='\n\n📲 *Apúntate en:* '+(window.location.origin||'https://tu-dominio.com');
  return t;
}

async function shareWhatsApp(text,title){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }
  }catch(e){}
  const waUrl='https://api.whatsapp.com/send?text='+encodeURIComponent(text);
  if(navigator.share&&/mobile|iphone|ipad|android/i.test(navigator.userAgent)){
    try{
      await navigator.share({title:title||'Barrio de Fantasía',text:text});
      return;
    }catch(e){if(e.name==='AbortError')return;}
  }
  window.open(waUrl,'_blank');
  toast('¡Texto copiado y abriendo WhatsApp!');
}

/* ---------- Motor de Confeti ---------- */
function fireConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  canvas.style.display='block';

  const colors=['#D7131F','#DFB343','#1E7B45','#FFFFFF','#1F4FA3','#FF6B6B'];
  const particles=[];
  for(let i=0;i<85;i++){
    particles.push({
      x:canvas.width*0.5+(Math.random()-0.5)*260,
      y:canvas.height*0.65,
      vx:(Math.random()-0.5)*16,
      vy:-Math.random()*18-8,
      w:Math.random()*10+6,
      h:Math.random()*8+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      angle:Math.random()*360,
      vAngle:(Math.random()-0.5)*12,
      opacity:1
    });
  }

  const start=performance.now();
  function animate(now){
    const elapsed=now-start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      p.vy+=0.45;p.vx*=0.98;p.x+=p.vx;p.y+=p.vy;p.angle+=p.vAngle;
      if(elapsed>1800)p.opacity-=0.02;
      if(p.y<canvas.height&&p.opacity>0){
        alive=true;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate((p.angle*Math.PI)/180);
        ctx.fillStyle=p.color;
        ctx.globalAlpha=Math.max(0,p.opacity);
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
    });
    if(alive&&elapsed<3500){
      requestAnimationFrame(animate);
    }else{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.style.display='none';
    }
  }
  requestAnimationFrame(animate);
}

function balance(ids){
  const ps=ids.map(P).filter(Boolean), half=Math.ceil(ps.length/2);
  let best=null;
  const avg=l=>l.length?sum(l,p=>p.rating)/l.length:0;
  const cnt=(l,pos)=>l.filter(p=>p.pos===pos).length;
  for(let t=0;t<4000;t++){
    const sh=shuffle(ps), A=sh.slice(0,half), B=sh.slice(half);
    let cost=Math.abs(avg(A)-avg(B))*10;
    ['POR','DEF','MED','DEL'].forEach(pos=>{cost+=Math.abs(cnt(A,pos)-cnt(B,pos))*(pos==='POR'?8:3)});
    cost+=Math.random()*.3;
    if(!best||cost<best.cost)best={cost:cost,A:A,B:B};
  }
  return {A:best.A.map(p=>p.id),B:best.B.map(p=>p.id)};
}

    let signStatus='';
    if(mine){
      signStatus=isWait?' · <b style="color:#B7790B">en lista de espera (#'+(myIdx-slots+1)+')</b>':' · <b style="color:#1E7B45">✓ tú estás dentro</b>';
    }
    const signBtn=canSign?'<button class="btn '+(mine?'':'primary')+' small" data-action="toggle-sign" data-id="'+next.id+'" data-pid="'+me.id+'">'+(mine?'Quitarme':'¡Apuntarme!')+'</button>':'';
    h+='<section class="hero"><div class="kick">Próximo partido</div><h1>'+esc(fmtLong(next))+' · '+esc(next.time)+'</h1>'+
       '<div class="where">'+esc(next.place||'Sin lugar definido')+' · Fútbol '+next.format+'</div>'+dots(next)+
       '<div class="row"><span class="count">'+Math.min(n,slots)+' de '+slots+' apuntados'+signStatus+'</span>'+
       '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+signBtn+'<button class="btn bib small" data-action="open-match" data-id="'+next.id+'">Abrir partido</button><button class="btn wa small" data-action="wa-convocatoria" data-id="'+next.id+'">'+WA_ICON+'WhatsApp</button></div></div></section>';
  }else{
    h+='<section class="hero empty"><h1>No hay partidos a la vista</h1><p>'+(me.isAdmin?'Crea el primero y la pandilla podrá apuntarse.':'El organizador publicará el próximo partido.')+'</p>'+(me.isAdmin?'<div><button class="btn bib" data-action="new-match">Crear partido</button></div>':'')+'</section>';
  }
  h+='<div class="sec-head"><h2>Partidos</h2>'+(me.isAdmin?'<button class="btn primary" data-action="new-match">Nuevo partido</button>':'')+'</div>';
  const rest=open.slice(1);
  if(rest.length)h+='<h3 class="sub" style="margin:0 0 8px">Próximos</h3><div class="list">'+rest.map(matchRow).join('')+'</div>';
  if(played.length)h+='<h3 class="sub" style="margin:18px 0 8px">Jugados</h3><div class="list">'+played.map(matchRow).join('')+'</div>';
  if(!rest.length&&!played.length&&next)h+='<div class="empty-note">Aquí irán apareciendo los demás partidos y los resultados.</div>';
  return h;
}

function renderPodium(rows){
  if(rows.length<3||rows[0].s.pts<=0)return '';
  const first=rows[0], second=rows[1], third=rows[2];
  const step=(r,cls,trophy)=>
    '<div class="podium-card '+cls+'" data-action="profile" data-id="'+r.p.id+'">'+
      '<span class="podium-rank">'+trophy+'</span>'+
      playerAvatar(r.p,'podium-avatar')+
      '<span class="podium-name">'+esc(r.p.name)+'</span>'+
      '<span class="podium-pts">'+r.s.pts+' <small style="font-size:12px;font-weight:600">pts</small></span>'+
      '<span class="podium-sub"><span class="pos-dot '+r.p.pos+'"></span>'+POS[r.p.pos]+' · '+r.s.pj+' PJ</span>'+
    '</div>';
  return '<div class="podium">'+step(second,'second','🥈')+step(first,'first','🥇')+step(third,'third','🥉')+'</div>';
}

     '<div class="budget" aria-hidden="true"><i class="'+(cost>BUDGET?'over':'')+'" style="width:'+pct+'%"></i></div><div class="squad">';

  const market=plist().filter(p=>ui.posFilter==='ALL'||p.pos===ui.posFilter).map(p=>({p:p,s:summary(p)})).sort((a,b)=>b.s.pts-a.s.pts||b.p.rating-a.p.rating);

  });
  return h+'</tbody></table></div>'+rulesBlock();
}

function viewAchievements(){
  const ps=plist().sort((a,b)=>a.name.localeCompare(b.name));
  let h='<div class="sec-head" style="margin-top:6px"><div><h2>Logros</h2><p class="sub">Qué porcentaje de la pandilla tiene cada logro, y quién lo tiene.</p></div></div>';
  if(!ps.length)return h+'<div class="empty-note">Todavía no hay jugadores con perfil.</div>';
  const data=ps.map(p=>({p:p,ach:achievementsOf(p.id)}));
  const n=ps.length, names=data[0].ach;
  const mine=data.find(d=>d.p.id===me.id);
  names.forEach((a,i)=>{
    const have=data.filter(d=>d.ach[i].ok).map(d=>d.p.name);
    const lack=data.filter(d=>!d.ach[i].ok).map(d=>d.p.name);
    const pct=Math.round(have.length/n*100);
    if(a.secret){
      const mineOk=!!(mine&&mine.ach[i].ok);
      if(!mineOk){
        h+='<div class="board" style="margin-bottom:10px;font-style:italic"><h3 style="margin:0">Logro secreto</h3><p class="sub" style="margin:4px 0 0">'+(have.length?'Desbloqueado por '+esc(have.join(', '))+'. Los detalles solo los ve quien lo ha conseguido.':'Nadie lo ha desbloqueado todavía.')+'</p></div>';
        return;
      }
      h+='<div class="board" style="margin-bottom:10px"><h3 style="margin:0">'+esc(a.name)+'</h3><p class="sub" style="margin:2px 0 0">'+esc(a.desc)+'</p><p class="sub" style="margin:8px 0 0">Lo has desbloqueado. Los demás solo ven que existe un logro secreto.</p></div>';
      return;
    }
    const all=have.length===n;
    h+='<div class="board" style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="margin:0">'+esc(a.name)+'</h3><b style="font-family:\'Barlow Condensed\',serif;font-size:28px;font-weight:800">'+pct+'%</b></div>'+
      '<p class="sub" style="margin:2px 0 10px">'+esc(a.desc)+'</p>'+
      '<div style="height:10px;background:var(--surface2);border-radius:999px;overflow:hidden"><i style="display:block;height:100%;width:'+pct+'%;background:var(--grass);border-radius:999px"></i></div>'+
      '<p class="sub" style="margin:6px 0 0">'+(all?'Lo tienen todos ('+n+' de '+n+')':have.length+' de '+n+' jugadores')+'</p>'+
      (all?'':'<details class="who"><summary>'+(have.length?'Ver quién lo tiene':'Ver quién le falta')+'</summary>'+
        (have.length?'<div class="chips" style="margin-top:10px">'+have.map(nm=>'<span class="chip on">'+esc(nm)+'</span>').join('')+'</div>':'<p class="sub" style="margin:10px 0 0">Nadie lo tiene todavía.</p>')+
        (lack.length?'<p class="sub" style="margin:10px 0 6px">Les falta</p><div class="chips">'+lack.map(nm=>'<span class="chip">'+esc(nm)+'</span>').join('')+'</div>':'')+
        '</details>')+
      '</div>';
  });
  return h;
}

/* ---------- Diálogos ---------- */
const dlg=document.getElementById('dlg');
let modalScrollY=0;
function openModalLock(){
  if(!document.documentElement.classList.contains('has-modal')){
    modalScrollY=window.scrollY||window.pageYOffset||document.documentElement.scrollTop||0;
    document.documentElement.classList.add('has-modal');
    document.body.classList.add('has-modal');
  }
}
function closeModalLock(){
  if(document.documentElement.classList.contains('has-modal')){
    document.documentElement.classList.remove('has-modal');
    document.body.classList.remove('has-modal');
    window.scrollTo(0,modalScrollY);
  }
}
function dlgHTML(html){
  const old=dlg.querySelector('.dlg-body');
  if(dlg.open&&old){
    const top=old.scrollTop;
    const openClasses=Array.from(old.querySelectorAll('details[open]')).map(d=>d.className);
    old.innerHTML=html;
    old.scrollTop=top;
    if(openClasses.length){
      old.querySelectorAll('details').forEach(d=>{
        if(openClasses.indexOf(d.className)>-1)d.open=true;
      });
    }
    return;
  }
  dlg.innerHTML='<div class="dlg-body">'+html+'</div>';
  if(!dlg.open){
    dlg.showModal();
    openModalLock();
  }
}
const closeDlg=()=>{
  if(dlg.open)dlg.close();
  closeModalLock();
  ui.achOpen=false;
};
dlg.addEventListener('close',()=>{
  dlgView=null;
  closeModalLock();
  ui.achOpen=false;
});
dlg.addEventListener('touchmove',e=>{
  if(e.target===dlg)e.preventDefault();
},{passive:false});
dlg.addEventListener('toggle',e=>{
  if(e.target&&e.target.classList.contains('ach-collapse')){

function teamBlock(ids,name,cls){
  const ps=ids.map(P).filter(Boolean);
  const avg=ps.length?(sum(ps,p=>p.rating)/ps.length).toFixed(1).replace('.',','):'–';
  return '<div class="team '+cls+'"><h3>'+name+'<small>Media '+avg+'</small></h3><ul>'+ps.map(p=>'<li><span><span class="pos-dot '+p.pos+'"></span>'+esc(p.name)+'</span><span class="tag">'+p.rating+'</span></li>').join('')+'</ul></div>';
}
function showMatch(id){
  const m=M(id);if(!m){closeDlg();return}
  if(m.status==='open'&&(m.teamA.length||m.teamB.length)){
    if(syncTeamsWithSignups(m)){
      if(D.matches[id]){
        D.matches[id].teamA=m.teamA;
        D.matches[id].teamB=m.teamB;
        D.matches[id].roles=m.roles;
      }
      if(me.isAdmin){
        apiJson('/api/docs/matches/'+id,{method:'PUT',body:JSON.stringify({data:rawMatch(m)})}).catch(()=>{});
      }
    }
  }
  dlgView={type:'match',id:id};
  let h=head(esc(fmtLong(m))+' · '+esc(m.time))+'<p class="sub" style="margin:0 0 6px">'+esc(m.place||'Sin lugar definido')+' · Fútbol '+m.format+'</p>';
  if(m.status==='played'){
    const mineIn=me.id&&(m.teamA.indexOf(me.id)>-1||m.teamB.indexOf(me.id)>-1);
    const mineDone=me.id&&statsEntered(m,me.id);
    const hasScore=matchHasScore(m);
    h+='<div class="board-score"><span>'+TEAM_A+'</span><b>'+(hasScore?scoreOf(m,'A')+'–'+scoreOf(m,'B'):'?–?')+'</b><span>'+TEAM_B+'</span></div>';
    if(me.isAdmin){
      h+='<div style="text-align:center;margin:-8px 0 14px"><button class="btn small" data-action="result-form" data-id="'+id+'">'+(hasScore?'Editar resultado oficial ('+m.scoreA+'–'+m.scoreB+')':'⚠️ Poner resultado oficial')+'</button></div>';
    }
    h+='<div class="actions" style="margin-top:0"><button class="btn wa" data-action="wa-result" data-id="'+id+'">'+WA_ICON+'WhatsApp: Resultado</button><button class="btn" data-action="share-open" data-id="'+id+'">Imagen para compartir</button></div>';
    if(ui.share===id)h+=shareBox();
    h+=pitchBlock(m);
    if(!hasScore){
      h+='<div class="banner"><p><b>Esperando resultado oficial:</b> El administrador debe indicar el resultado total antes de que los jugadores podáis anotar goles, asistencias o votar notas.</p></div>';
    }else if(!votesClosed(m)){
      h+='<div class="banner"><p><b>Votación en curso (24 h):</b> Los puntos fantasy y los logros del partido se publicarán cuando finalicen las votaciones. Quien no vote a sus compañeros recibirá una penalización de −2 puntos en fantasy.</p></div>';
    }else if(mineIn&&!mineDone){
      h+='<div class="banner"><p><b>Anota tus goles y asistencias.</b> Así el marcador y tus puntos salen bien.</p></div>';
    }
    h+='<div class="tbl-wrap"><table class="rtable"><thead><tr><th>Jugador</th><th>G</th><th>A</th><th>Pts</th></tr></thead><tbody>';
    [[m.teamA,TEAM_A,'A',m.scoreA],[m.teamB,TEAM_B,'B',m.scoreB]].forEach(t=>{
      const teamList=t[0], teamName=t[1], side=t[2], maxG=(t[3]!=null?Number(t[3]):null);
      const teamG = sum(teamList, id => statOf(m, id).g);
      const teamA = sum(teamList, id => statOf(m, id).a);
      const scoreSub = hasScore ? ' · Goles: '+teamG+'/'+maxG+' · Asistencias: '+teamA+'/'+teamG : '';
      h+='<tr class="grp"><td colspan="4">'+teamName+scoreSub+'</td></tr>';
      teamList.map(P).filter(Boolean).forEach(p=>{
        const s=statOf(m,p.id), can=hasScore&&(me.isAdmin||p.id===me.id)&&me.canWrite!==false;
        const noVote = votesClosed(m) && !playerVoted(m, p.id);
        const penaltyTag = noVote ? ' <span class="tag" style="background:rgba(215,19,31,.15);color:var(--danger);font-weight:800;font-size:10px" title="Penalización de −2 pts fantasy por no votar">−2 no votó</span>' : '';
        const extra=(realMvps(m).indexOf(p.id)>-1&&votesClosed(m)?' <span class="tag warn">MVP</span>':'')+(votesClosed(m)&&fantasyMvps(m).indexOf(p.id)>-1?' <span class="tag warn">MVP Fantasy</span>':'')+matchIcons(m,p.id)+penaltyTag;
        let cellG='<b>'+s.g+'</b>';
        let cellA='<b>'+s.a+'</b>';
        if(can){
          const otherG = teamG - s.g;
          const otherA = teamA - s.a;
          const maxAvailG = maxG != null ? Math.max(s.g, maxG - otherG) : 30;
          let optsG = '';
          for(let n=0; n<=maxAvailG; n++){
            optsG += '<option value="'+n+'"'+(s.g===n?' selected':'')+'>'+n+'</option>';
          }
          cellG = '<select class="num-select stat-select" data-action="stat-change" data-id="'+id+'" data-pid="'+p.id+'" data-f="g" aria-label="Goles de '+esc(p.name)+'">'+optsG+'</select>';

          const maxAvailA = Math.max(s.a, teamG - otherA);
          let optsA = '';
          for(let n=0; n<=maxAvailA; n++){
            optsA += '<option value="'+n+'"'+(s.a===n?' selected':'')+'>'+n+'</option>';
          }
          cellA = '<select class="num-select stat-select" data-action="stat-change" data-id="'+id+'" data-pid="'+p.id+'" data-f="a" aria-label="Asistencias de '+esc(p.name)+'">'+optsA+'</select>';
        }
        h+='<tr><td><span class="pos-dot '+p.pos+'"></span>'+esc(p.name)+extra+'</td><td>'+cellG+'</td><td>'+cellA+'</td><td class="pts">'+(votesClosed(m)?fmtNum(matchPoints(p,m)||0):'<span style="color:var(--muted);font-size:12px" title="Los puntos se publican al cerrar las votaciones">–</span>')+'</td></tr>';
      });
    });
    h+='</tbody></table></div>';
    if(votesClosed(m)){
      const real=realMvps(m).map(P).filter(Boolean);
      if(real.length){
        const R=ratingsFor(m);
        const avgNote=R[real[0].id]?R[real[0].id].avg:null;
        h+='<div class="mvp-banner"><div class="mvp-star">👑</div><div class="mvp-text"><div class="mvp-kicker">MVP DEL PARTIDO</div><div class="mvp-name">'+esc(real.map(p=>p.name).join(' y '))+'</div>'+(avgNote?'<div class="mvp-score">Elegido por votación con nota media '+fmtNum(avgNote)+'</div>':'')+'</div><button class="btn small primary" data-action="fire-confetti" style="background:#dfb343;border-color:#dfb343;color:#111">🎉 ¡Celebrar!</button></div>';
      }
    }
    h+=(votesClosed(m)?predResult(m)+mvpBlock(m):'')+ratingBlock(m);
    if(me.isAdmin)h+='<div class="actions"><button class="btn" data-action="result-form" data-id="'+id+'">Resultado oficial</button><button class="btn" data-action="edit-match" data-id="'+id+'">Editar datos</button><button class="btn danger" data-action="delete-match" data-id="'+id+'">Eliminar</button></div>';
  }else{
    const slots=m.format*2, signed=signedFor(id), conf=signed.slice(0,slots), wait=signed.slice(slots), mineOn=me.id&&signed.indexOf(me.id)>-1;
    h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px;flex-wrap:wrap"><h3 style="font-size:22px;margin:0">Convocatoria: '+conf.length+'/'+slots+(wait.length?' ('+wait.length+' en espera)':'')+'</h3>'+
       (me.id&&D.players[me.id]&&me.canWrite!==false?'<button class="btn '+(mineOn?'':'primary')+' small" data-action="toggle-sign" data-id="'+id+'" data-pid="'+me.id+'">'+(mineOn?'Quitarme':'¡Apuntarme!')+'</button>':'')+
       '</div>';
    if(!me.id||!D.players[me.id]){
      h+='<p class="sub" style="margin:0 0 10px">Crea tu perfil para apuntarte.</p>';
    }
    if(mineOn&&me.canWrite!==false)h+=myRoleBlock(m);

    // Titulares confirmados
    h+='<div class="sec-head" style="margin:14px 0 8px"><h4 style="font-size:18px;margin:0;display:flex;align-items:center;gap:6px">🟢 Titulares confirmados</h4><span class="tag" style="background:rgba(30,123,69,.15);color:var(--DEF);font-weight:800">'+conf.length+' de '+slots+'</span></div>';
    if(conf.length){
      h+='<div class="convocatoria-grid">'+conf.map((pid,idx)=>{
        const p=P(pid);if(!p)return '';
        const can=me.isAdmin||p.id===me.id;
        return '<div class="conv-card'+(p.id===me.id?' mine':'')+'">'+
          '<span class="conv-num">'+(idx+1)+'</span>'+
          playerAvatar(p,'conv-avatar')+
          '<div class="conv-info"><b>'+esc(p.name)+(p.id===me.id?' <small style="color:var(--grass);font-weight:700">(tú)</small>':'')+'</b><span><span class="pos-dot '+p.pos+'"></span>'+POS[p.pos]+(p.dorsal?' · #'+p.dorsal:'')+' · '+p.rating+'</span></div>'+
          (can?'<button class="conv-remove" data-action="toggle-sign" data-id="'+id+'" data-pid="'+p.id+'" title="Quitar">×</button>':'')+
        '</div>';
      }).join('')+'</div>';
    }else{
      h+='<div class="empty-note" style="padding:14px">Aún no hay nadie apuntado. ¡Sé el primero!</div>';
    }

    // Lista de espera
    if(wait.length){
      h+='<div class="sec-head" style="margin:16px 0 8px"><h4 style="font-size:18px;margin:0;display:flex;align-items:center;gap:6px">🟡 En lista de espera</h4><span class="tag" style="background:rgba(183,121,11,.15);color:var(--MED);font-weight:800">'+wait.length+'</span></div>';
      h+='<div class="convocatoria-grid">'+wait.map((pid,idx)=>{
        const p=P(pid);if(!p)return '';
        const can=me.isAdmin||p.id===me.id;
        return '<div class="conv-card wait'+(p.id===me.id?' mine':'')+'">'+
          '<span class="conv-num wait">#'+(idx+1)+'</span>'+
          playerAvatar(p,'conv-avatar')+
          '<div class="conv-info"><b>'+esc(p.name)+(p.id===me.id?' <small style="color:var(--grass);font-weight:700">(tú)</small>':'')+'</b><span style="color:var(--MED);font-weight:600">Turno '+(idx+1)+' en espera</span></div>'+
          (can?'<button class="conv-remove" data-action="toggle-sign" data-id="'+id+'" data-pid="'+p.id+'" title="Quitar">×</button>':'')+
        '</div>';
      }).join('')+'</div>';
    }

    // Resto de la pandilla
    const unsigned=plist().filter(p=>signed.indexOf(p.id)<0).sort((a,b)=>a.name.localeCompare(b.name));
    if(unsigned.length){
      h+='<details class="conv-unsigned" style="margin-top:14px">'+
           '<summary class="sub" style="cursor:pointer;font-weight:700;padding:6px 0">Ver resto de la pandilla ('+unsigned.length+' disponibles) ▾</summary>'+
           '<div class="chips" style="margin-top:8px">'+unsigned.map(p=>{
             const can=me.isAdmin;
             return '<button class="chip" '+(can?'data-action="toggle-sign" data-id="'+id+'" data-pid="'+p.id+'" title="Apuntar al partido"':'disabled')+'>'+(can?'+ ':'')+esc(p.name)+'</button>';
           }).join('')+'</div>'+
         '</details>';
    }

    const hasTeams=m.teamA.length>0||m.teamB.length>0;
    if(!hasTeams){
      h+='<div class="actions" style="margin-top:14px"><button class="btn wa" data-action="wa-convocatoria" data-id="'+id+'">'+WA_ICON+'WhatsApp: Convocatoria</button></div>';
    }
    if(me.isAdmin){
      h+='<p class="sub" style="margin-top:8px">Como organizador puedes apuntar o quitar a cualquiera tocando su nombre o la cruz.</p>';
      h+='<div class="actions"><button class="btn bib" data-action="gen-teams" data-id="'+id+'"'+(conf.length<4?' disabled':'')+'>'+(hasTeams?'Repartir de nuevo':'Generar equipos equilibrados')+'</button></div>';
    }
    if(hasTeams){
      h+='<div class="actions" style="margin:10px 0"><button class="btn wa" data-action="wa-teams" data-id="'+id+'">'+WA_ICON+'WhatsApp: Equipos repartidos</button></div>';
      h+='<div class="teams">'+teamBlock(m.teamA,TEAM_A,'a')+teamBlock(m.teamB,TEAM_B,'b')+'</div>';
      h+=pitchBlock(m)+adjustBlock(m)+predBlock(m);
      if(me.isAdmin)h+='<div class="actions"><button class="btn primary" data-action="result-form" data-id="'+id+'">Terminar partido</button></div>';
    }
    if(me.isAdmin)h+='<div class="actions" style="margin-top:10px"><button class="btn small" data-action="edit-match" data-id="'+id+'">Editar datos</button><button class="btn small danger" data-action="delete-match" data-id="'+id+'">Eliminar</button></div>';
  }
  dlgHTML(h);
  if(ui.share===id)drawShare(m);
}

/* mode: id existente | 'me' (perfil propio nuevo) | 'guest' (jugador sin cuenta) */
function playerForm(mode){
  dlgView={type:'form'};
  const pid=mode==='me'?me.id:mode, existing=(mode!=='guest'&&pid)?P(pid):null;
  const isMine=pid&&pid===me.id;
  const name=existing?existing.name:(mode==='me'?me.name:''), pos=existing?existing.pos:'MED', dorsal=existing&&existing.dorsal?existing.dorsal:'';
  const showRating=me.isAdmin, rating=existing?existing.rating:DEFAULT_RATING;
  const title=mode==='guest'?'Jugador sin cuenta':(isMine?(existing?'Mi perfil':'Crea tu perfil'):'Editar jugador');
  const hasPhoto=existing&&existing.photo;

    '<div style="display:flex;align-items:center;gap:14px;margin:10px 0 16px;background:var(--surface2);padding:12px 14px;border-radius:20px">'+
      '<div id="f-photo-preview" class="avatar avatar-lg '+(hasPhoto?'has-img':(dorsal?'is-dorsal':''))+'" style="background:var(--bib);color:var(--on-bib)">'+
        (hasPhoto?'<img src="'+esc(existing.photo)+'" alt="Foto">':(dorsal?esc(dorsal):(initials(name)||'?')))+
      '</div>'+
      '<div style="flex:1">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<label class="btn small primary" style="cursor:pointer;margin:0">'+
            '<span id="f-photo-label">'+(hasPhoto?'Cambiar foto':'Subir foto')+'</span>'+
            '<input type="file" id="f-photo-file" accept="image/*" style="display:none">'+
          '</label>'+
          '<button type="button" class="btn small" data-action="photo-remove" id="f-photo-remove" style="display:'+(hasPhoto?'inline-block':'none')+'">Quitar</button>'+
        '</div>'+
        '<p class="sub" style="margin:6px 0 0;font-size:12px">Foto para el cromo y alineaciones (se recorta cuadrada).</p>'+
        '<input type="hidden" id="f-photo-data" value="'+(hasPhoto?esc(existing.photo):'')+'">'+
      '</div>'+
    '</div>'+
    '<label class="f">Nombre<input type="text" id="f-name" maxlength="24" value="'+esc(name)+'"></label>'+
    '<div class="two"><label class="f">Posición<select id="f-pos">'+Object.keys(POS).map(k=>'<option value="'+k+'"'+(pos===k?' selected':'')+'>'+POS[k]+'</option>').join('')+'</select></label>'+
    '<label class="f">Dorsal (opcional)<input type="number" id="f-dorsal" min="1" max="99" inputmode="numeric" value="'+esc(dorsal)+'"></label></div>'+
    (showRating?'<label class="f">Valoración (solo el organizador): <output id="f-out">'+rating+'</output><input type="range" id="f-rating" min="40" max="99" value="'+rating+'"></label><p class="sub" id="f-price">Precio en fantasy: '+money(price({rating:rating}))+'</p>':'<p class="sub">La valoración te la asigna el organizador.</p>')+
    '<div class="actions"><button class="btn primary" data-action="save-player" data-id="'+esc(mode)+'">'+(existing?'Guardar cambios':(mode==='guest'?'Añadir jugador':'Guardar perfil'))+'</button>'+
    (existing&&me.isAdmin?'<button class="btn danger" data-action="delete-player" data-id="'+pid+'">Eliminar</button>':'')+'</div>');
}

/* ---------- Datos de ejemplo (solo organizador) ---------- */
async function loadDemo(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};
  const pid=n=>'demo-p'+n;
  const defs=[['Álvaro','POR',72,1],['Dani','DEF',68,4],['Marcos','DEF',74,5],['Iván','DEF',63,2],['Sergio','MED',80,8],['Pablo','MED',71,6],['Javi','MED',66,14],['Rubén','MED',77,10],['Carlos','DEL',82,9],['Nacho','DEL',69,11],['Lucas','DEL',75,7],['Edu','POR',60,13]];
  for(let i=0;i<defs.length;i++){
    const x=defs[i];
    await db.doc('players/'+pid(i+1)).set({name:x[0],pos:x[1],dorsal:x[3],guest:true});
    await db.doc('ratings/'+pid(i+1)).set({rating:x[2]});
  }
  const fant={
    'demo-g1':{name:'Los Cracks de Alberto',squad:[pid(9),pid(5),pid(8),pid(1),pid(4)],captain:pid(9)},
    'demo-g2':{name:'FC Tapas',squad:[pid(11),pid(3),pid(6),pid(10),pid(12)],captain:pid(11)},
    'demo-g3':{name:'Deportivo Cañas',squad:[pid(5),pid(11),pid(7),pid(2),pid(12)],captain:pid(5)}
  };
  for(const k in fant)await db.doc('fantasy/'+k).set(fant[k]);
  const snap={};for(const k in fant)snap[k]={squad:fant[k].squad,captain:fant[k].captain};
  const S=(o)=>{const r={};for(const n in o)r[pid(n)]=o[n];return r};
  const place='Pista 2, polideportivo del barrio';
  await db.doc('matches/demo-m1').set({date:d(-14),time:'20:30',place:place,format:6,status:'played',scoreA:3,scoreB:2,
    teamA:[pid(1),pid(2),pid(5),pid(6),pid(9),pid(10)],teamB:[pid(12),pid(3),pid(4),pid(7),pid(8),pid(11)],
    stats:S({9:{g:2},5:{g:1,a:1},6:{a:1},8:{g:1,a:1},4:{a:1},11:{g:1}}),fantasySnap:snap});
  await db.doc('matches/demo-m2').set({date:d(-7),time:'20:30',place:place,format:6,status:'played',scoreA:3,scoreB:1,
    teamA:[pid(1),pid(3),pid(5),pid(7),pid(11),pid(10)],teamB:[pid(12),pid(2),pid(4),pid(6),pid(8),pid(9)],
    stats:S({5:{g:1,a:1},11:{g:1},7:{g:1},10:{a:1},9:{g:1},6:{a:1}}),fantasySnap:snap});

  /* Partido jugado de ejemplo: goles, asistencias, notas y predicciones */
  const A3=[1,2,3,5,9,11], B3=[12,4,6,7,8,10];
  const G3={9:{g:2,a:0},5:{g:1,a:1},11:{g:1,a:2},8:{g:1,a:0},6:{g:0,a:1}};
  await db.doc('matches/demo-m3').set({date:d(-2),time:'20:30',place:place,format:6,status:'played',scoreA:4,scoreB:1,
    teamA:A3.map(pid),teamB:B3.map(pid),stats:{},playedAt:Date.now()-2*86400000,fantasySnap:snap});
  for(const n in G3){
    await db.doc('statsby/'+pid(n)).set({matches:{'demo-m3':{g:G3[n].g,a:G3[n].a}}});
  }
  const R={1:7.5,2:6,3:7,5:8.5,9:9,11:7.5,12:6.5,4:6,6:6.5,7:5.5,8:7,10:6};
  const lineup=A3.concat(B3);
  for(const v of lineup){
    const sc={};
    lineup.forEach(t=>{if(t!==v)sc[pid(t)]=R[t]});
    await db.doc('votes/'+pid(v)).set({matches:{'demo-m3':sc}});
  }
  const picks={1:'A',2:'A',9:'A',3:'B',5:'D',12:'B'};
  for(const n in picks)await db.doc('preds/'+pid(n)).set({matches:{'demo-m3':picks[n]}});
