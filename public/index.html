  'stat-change':async el=>{
    const mid=el.dataset.id, pid=el.dataset.pid, f=el.dataset.f;
    const newNum=parseInt(el.value,10);
    if(isNaN(newNum)||newNum<0)return;
    if(!(me.isAdmin||pid===me.id)||me.canWrite===false)return;
    const m=M(mid);if(!m)return;
    if(!matchHasScore(m)){
      alert('El administrador debe fijar primero el resultado oficial del partido antes de poder anotar goles o asistencias.');
      return;
    }
    const isA=m.teamA.indexOf(pid)>-1, isB=m.teamB.indexOf(pid)>-1;
    if(!isA&&!isB)return;
    const teamIds=isA?m.teamA:m.teamB;
    const maxG=isA?Number(m.scoreA):Number(m.scoreB);
    const cur=statOf(m,pid);

    let otherG=0, otherA=0;
    teamIds.forEach(id=>{
      if(id!==pid){
        const st=statOf(m,id);
        otherG+=st.g;
        otherA+=st.a;
      }
    });

    let newG=cur.g, newA=cur.a;
    if(f==='g') newG=newNum;
    if(f==='a') newA=newNum;

    const totalG=otherG+newG;
    const totalA=otherA+newA;

    if(totalG>maxG){
      alert('Los goles del equipo ('+totalG+') no pueden superar el resultado oficial ('+maxG+').');
      el.value=cur[f];
      return;
    }
    if(totalA>totalG){
      alert('Las asistencias del equipo ('+totalA+') no pueden superar los goles marcados ('+totalG+'). Reduce primero las asistencias antes de bajar los goles.');
      el.value=cur[f];

    ms[mid]={g:newG,a:newA};

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]');
  if(el&&!el.disabled){
    const f=A[el.dataset.action];
    if(f)f(el,e);
  }
  if(e.target&&e.target.id==='f-photo-file'){
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const size=256;
        canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext('2d');
        const minDim=Math.min(img.width,img.height);
        const sx=(img.width-minDim)/2;
        const sy=(img.height-minDim)/2;
        ctx.drawImage(img,sx,sy,minDim,minDim,0,0,size,size);
        const dataUrl=canvas.toDataURL('image/jpeg',0.82);
        const hid=document.getElementById('f-photo-data');
        if(hid){hid.value=dataUrl;delete hid.dataset.removed;}
        const prev=document.getElementById('f-photo-preview');
        if(prev){
          prev.className='avatar avatar-lg has-img';
          prev.innerHTML='<img src="'+dataUrl+'" alt="Foto">';
        }
        const remBtn=document.getElementById('f-photo-remove');
        if(remBtn)remBtn.style.display='inline-block';
        const lbl=document.getElementById('f-photo-label');
        if(lbl)lbl.textContent='Cambiar foto';
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }
});

/* ---------- Arranque (servidor propio) ---------- */
let auth=null;
const subs={};
async function apiJson(p,opts){
  const o=Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},opts||{});
  const r=await fetch(p,o);
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((j&&j.error)||('Error '+r.status));err.status=r.status;err.code=r.status===403?'invalid_argument':'error';throw err}
  return j;
}
function authMsg(t, isError=true){
  const el=document.getElementById('auth-msg');
  if(!el)return;
  if(!t){el.innerHTML='';return}
  const bg=isError?'rgba(217,83,79,.12)':'rgba(30,123,69,.15)';
  const col=isError?'var(--danger)':'var(--grass)';
  el.innerHTML='<div style="background:'+bg+';color:'+col+';padding:10px 14px;border-radius:12px;font-weight:700;display:inline-block;max-width:100%;line-height:1.4">'+esc(t)+'</div>';
}

db={
  doc:path=>({
    set:data=>apiJson('/api/docs/'+path,{method:'PUT',body:JSON.stringify({data:data})}).then(()=>pull()),
    delete:()=>apiJson('/api/docs/'+path,{method:'DELETE'}).then(()=>pull())
  }),
  collection:name=>({onSnapshot:(cb,err)=>{subs[name]={cb:cb,err:err}}})
};
let lastSnapshotEtag = null;
async function pull(){
  if(document.hidden)return; // Pausar polling en segundo plano para ahorrar batería y datos móviles
  let j;
  try{
    const headers = {};
    if(lastSnapshotEtag) headers['If-None-Match'] = lastSnapshotEtag;
    const res = await fetch('/api/snapshot', { credentials:'same-origin', headers });
    if(res.status === 304){
      auth = 'ok';
      return; // Base de datos sin cambios (0 bytes descargados)
    }
    if(res.status === 401){
      const changed = (auth!=='anon');
      auth='anon';
      if(changed) scheduleRender();
      return;
    }
    if(!res.ok){
      let errJ = null; try{ errJ = await res.json() }catch(e){}
      const err = new Error((errJ && errJ.error) || ('Error ' + res.status));
      err.status = res.status;
      throw err;
    }
    const etag = res.headers.get('ETag');
    if(etag) lastSnapshotEtag = etag;
    j = await res.json();
  }catch(e){
    Object.keys(subs).forEach(n=>{if(subs[n].err)subs[n].err(e)});
    return;
  }
  auth='ok';
  let anyChange = !allLoaded();
  if(j.me){
    if(me.id!==j.me.id || me.name!==(j.me.name||'') || me.isAdmin!==!!j.me.isAdmin){
      anyChange = true;
      me.id=j.me.id;me.name=j.me.name||'';me.isAdmin=!!j.me.isAdmin;me.canWrite=true;
    }
  }
  COLLECTIONS.forEach(name=>{
    const sub=subs[name];if(!sub)return;
    const col=(j.collections&&j.collections[name])||{};
    const prevStr=JSON.stringify(D[name]||{});
    const newStr=JSON.stringify(col);
    if(prevStr!==newStr) anyChange=true;
    sub.cb({docs:Object.keys(col).map(id=>({id:id,data:()=>col[id]}))});
  });
  if(anyChange){
    scheduleRender();
  }
}
async function init(){
  const qs=new URLSearchParams(location.search);
  if(qs.get('reset'))resetToken=qs.get('reset');
  if(qs.get('verificado'))flashMsg='Cuenta confirmada. Ya puedes entrar con tu email y contraseña.';
  if(qs.get('reset')||qs.get('verificado'))history.replaceState(null,'','/');
  render();
  COLLECTIONS.forEach(name=>{
    db.collection(name).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});D[name]=o;loaded[name]=true},
      err=>{status='error';errCode=(err&&err.code)||'';scheduleRender()});
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) pull();
  });
  await pull();
  setInterval(pull,3000);
}
init();
})();
